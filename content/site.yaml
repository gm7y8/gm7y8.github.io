      - { type: paragraph, text: "The update carried checkpoint and savepoint type data through the runtime REST response and surfaced it in the history view, making the origin of each entry easier to understand." }
      - { type: paragraph, text: "The pull request was merged into Apache Flink in October 2020 as part of FLINK-18851." }
