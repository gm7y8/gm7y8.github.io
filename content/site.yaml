about:
  eyebrow: About
  headline: Software engineer, systems thinker, and lifelong student.
  introduction: I have built my career across software development, data engineering, computer networks, and cloud-native systems, while continuing advanced study in artificial intelligence.
  valuesEyebrow: Focus areas
  valuesTitle: Systems, data, and applied AI.
  paragraphs:
    - Since 2017, I have worked at Cisco in the San Francisco Bay Area, currently as a Software Engineer IV (Data Engineer). Earlier roles at TCS, the National Association of Insurance Commissioners, and the University of Missouri–Kansas City built a foundation in software engineering, databases, testing, computer networks, and teaching.
    - I contribute to open-source repositories including Apache Flink, Apache Hive, and Kubernetes.
    - My current learning centers on generative AI, deep learning, reinforcement learning, and deep generative models through Stanford Engineering. I also study the systems around modern software, including Kubernetes, Flink, Apache Beam, Docker, microservices, Java, Python, Go, and Node.js.
    - I hold a master’s degree in Computer Science from UMKC and a bachelor’s degree in Electronics and Communication Engineering from Jawaharlal Nehru Technological University. In 2025, I also completed MIT xPRO’s Quantum Computing program.
