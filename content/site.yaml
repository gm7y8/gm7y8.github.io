posts:
  - slug: how-a-quantum-computer-could-break-rsa
    date: Dec 2025
    title: How a Quantum Computer Could Break RSA
    excerpt: How Shor’s algorithm could use quantum period finding to expose the prime factors behind an RSA public key.
    description: A plain-language explanation of how a sufficiently powerful quantum computer could use Shor’s algorithm to break RSA.
    tag: Quantum Computing
    readingTime: 3 min
    deck: RSA relies on a mathematical problem that is difficult for ordinary computers but vulnerable to a sufficiently capable quantum computer.
    featured: true
    body:
      - { type: lead, text: "RSA is one of the ways computers protect information online. Its security depends on a simple idea: multiplying two very large prime numbers is easy, but figuring out which primes were multiplied together is extremely difficult for ordinary computers." }
      - { type: paragraph, text: "Shor’s algorithm shows how a sufficiently powerful quantum computer could solve that problem. It could find a repeating pattern in a sequence of calculations and use that pattern to reveal the secret prime numbers behind an RSA public key. Once the primes are known, the private key can be rebuilt." }
      - type: image
        src: /images/shors-algorithm-rsa-flowchart.png
        alt: Flowchart showing how a quantum computer could use a repeating pattern to recover the prime factors of an RSA public key and rebuild the private key.
        caption: Shor’s algorithm uses quantum period finding followed by classical calculations to recover the factors behind an RSA public key.
        width: 1244
        height: 1106
      - type: richParagraph
        parts:
          - { text: "The repeating pattern is the important part. Shor’s algorithm uses quantum computing to find that pattern efficiently, then ordinary calculations turn it into the secret primes. The algorithm was described by mathematician Peter Shor in 1994. " }
          - { text: Read Shor’s paper, url: "https://arxiv.org/abs/quant-ph/9508027" }
          - { text: "." }
      - type: richParagraph
        parts:
          - { text: "This does not mean today’s quantum computers can break real-world RSA keys. That would require a much more powerful, reliable quantum computer than has been demonstrated. But because building and updating security systems takes time, researchers are already preparing cryptography designed to withstand quantum attacks. " }
          - { text: Read NIST’s overview of quantum computing, url: "https://www.nist.gov/quantum-information-science/quantum-computing-explained" }
          - { text: "." }
  - slug: recipe-text-classification-graph-neural-networks
    date: Winter 2022
    title: Recipe text classification with graph neural networks
    excerpt: A Stanford CS224N project comparing a graph-convolutional text classifier with an LSTM baseline.
    description: A short summary of my Stanford CS224N graph neural network project for recipe classification.
    tag: Stanford
    readingTime: 2 min
    deck: Representing recipe text as a graph offers another way to capture relationships between ingredients and language.
    featured: true
    sourceUrl: https://web.stanford.edu/class/archive/cs/cs224n/cs224n.1224/reports/custom_117176180.pdf
    sourceLabel: Read the Stanford CS224N report
    body:
      - { type: lead, text: "For my Stanford CS224N custom project, I used graph convolutional networks to classify recipe text into categories such as vegetarian and meat." }
      - { type: paragraph, text: "I compared the graph-based model with a Long Short-Term Memory baseline on the same training and test data. The graph convolutional network reached stronger validation performance and learned more quickly in the reported experiments." }
      - { type: paragraph, text: "The project explored how graph representations can model relationships and interdependencies that are difficult to express as a simple sequence." }
  - slug: garbage-harvesting-deep-learning
    date: Fall 2021
    title: Garbage harvesting using deep learning
    excerpt: A Stanford CS230 project using transfer learning and OCR to classify waste and identify recycling labels.
    description: A short summary of my Stanford CS230 deep-learning project for waste classification.
    tag: Stanford
    readingTime: 2 min
    deck: Computer vision can make waste sorting more accurate while also recognizing labels that carry recycling value.
    featured: true
    sourceUrl: https://cs230.stanford.edu/projects_fall_2021/reports/103171653.pdf
    sourceLabel: Read the Stanford CS230 report
    body:
      - { type: lead, text: "For Stanford CS230, I trained transfer-learning models to classify waste into cardboard, glass, metal, paper, plastic, and trash." }
      - { type: paragraph, text: "The experiments compared ResNet18 and ResNet50 with cross-entropy and multi-margin loss. The best ResNet50 configuration achieved 92.36% test accuracy and an F1 score of 0.92." }
      - { type: paragraph, text: "I also combined CRAFT text detection with Tesseract OCR to identify text on plastic and glass labels, including California redemption markings." }
